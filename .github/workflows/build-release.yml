# Builds the release jars for every Minecraft version and loader and commits them to release/<version>/ on the
# branch it runs on, ready for the Publish workflow. Runs on every push to a release/<version> branch (the jar commit
# itself is pushed with the workflow token, so it does not start another run) or by hand. Checks each jar before committing: the file name, the version
# inside it, Forge's SRG mapping and Fabric's intermediary mapping on 1.20.1 and 1.21.1. Uploads nothing.

name: Build release jars

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Version (must match version= in every gradle.properties)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { minecraft: "1.20.1", java: "17", loaders: "forge fabric" }
          - { minecraft: "1.21.1", java: "21", loaders: "neoforge fabric" }
          - { minecraft: "26.2", java: "25", loaders: "neoforge fabric" }
          - { minecraft: "26.3", java: "25", loaders: "neoforge fabric" }
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "V=${INPUT_VERSION:-${GITHUB_REF_NAME#release/}}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.minecraft }}
        run: |
          grep -qx "version=${{ env.V }}" gradle.properties || { echo "gradle.properties is not at ${{ env.V }}"; exit 1; }
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Pick and check the jars
        env:
          MC: ${{ matrix.minecraft }}
          VERSION: ${{ env.V }}
          LOADERS: ${{ matrix.loaders }}
        run: |
          set -e
          mkdir -p out
          for loader in $LOADERS; do
            name="bunnyland-$loader-$MC-$VERSION.jar"
            jar="$MC/$loader/build/libs/$name"
            ls -la "$MC/$loader/build/libs"
            [ -f "$jar" ] || { echo "Missing $jar"; exit 1; }
            dir=$(mktemp -d)
            unzip -q "$jar" -d "$dir"
            butterfly="$dir/com/sugarplumstudios/bunnyland/entity/RainbowButterfly.class"
            [ -f "$butterfly" ] || { echo "$name has no RainbowButterfly class"; exit 1; }
            case "$loader" in
              fabric) grep -q "\"version\": \"$VERSION\"" "$dir/fabric.mod.json" || { echo "$name: fabric.mod.json is not $VERSION"; exit 1; } ;;
              *) grep -q "Implementation-Version: $VERSION" "$dir/META-INF/MANIFEST.MF" || { echo "$name: manifest is not $VERSION"; exit 1; } ;;
            esac
            if [ "$loader" = forge ]; then
              strings "$butterfly" | grep -q '^f_[0-9]*_$' || { echo "$name is not SRG-mapped"; exit 1; }
            fi
            if [ "$loader" = fabric ] && [ "$MC" = 1.20.1 -o "$MC" = 1.21.1 ]; then
              strings "$butterfly" | grep -q 'class_[0-9]' || { echo "$name is not intermediary-mapped"; exit 1; }
            fi
            case "$MC" in
              26.*) strings "$dir/com/sugarplumstudios/bunnyland/registry/ModEntities.class" | grep -q TEMPT_RANGE || { echo "$name lacks the tempt range fix"; exit 1; } ;;
            esac
            cp "$jar" out/
            echo "OK $name $(stat -c %s "$jar") bytes"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.minecraft }}
          path: out/*.jar

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "V=${INPUT_VERSION:-${GITHUB_REF_NAME#release/}}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release/${{ env.V }}
          pattern: release-*
          merge-multiple: true
      - name: Commit the jars
        env:
          VERSION: ${{ env.V }}
        run: |
          ls -la "release/$VERSION"
          [ "$(ls release/$VERSION/*.jar | wc -l)" = 8 ] || { echo "Expected 8 jars"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release/$VERSION"/*.jar
          git commit -m "Release jars for $VERSION"
          git push
